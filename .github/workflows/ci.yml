name: MES and Assembly
on:
  push:
    branches: [claude/operator-shift-target-logic-wn5ebj]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            assembly/package-lock.json
      - run: npm ci
      - run: npm --prefix assembly ci
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix assembly test
      - run: npm run build
